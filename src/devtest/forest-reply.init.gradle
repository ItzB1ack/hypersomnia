import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

// Opt-in tests only. No build.gradle changes, no new dependencies, no test classes in the mod JAR.
// ./gradlew -I src/devtest/forest-reply.init.gradle forestReplySelfTests
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def output = p.layout.buildDirectory.dir('forest-reply-selftests')
    def compile = p.tasks.register('compileForestReplySelfTests', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source p.fileTree('src/devtest/java') { include '**/ForestReply*SelfTest.java' }
        classpath = p.files(p.sourceSets.main.output, p.configurations.compileClasspath)
        destinationDirectory = output
        javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
        options.encoding = 'UTF-8'
        options.release = 21
    }
    def runners = ['ForestReplySelfTest', 'ForestReplyCodecSelfTest'].collect { name ->
        p.tasks.register('run' + name, JavaExec) {
            dependsOn compile
            classpath = p.files(output, p.sourceSets.main.runtimeClasspath)
            javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
            mainClass = 'com.hypersomnia.forest.' + name
            workingDir = p.layout.buildDirectory.dir('forest-reply-selftests-runtime').get().asFile
            doFirst { workingDir.mkdirs() }
        }
    }
    p.tasks.register('forestReplySelfTests') { dependsOn runners }
}